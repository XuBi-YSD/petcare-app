<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hồ sơ thú cưng — Sổ Tay Thú Cưng</title>
<meta name="theme-color" content="#2F4F41" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

<header id="site-header" class="site-header"></header>

<main class="wrap" style="max-width:720px;">
  <span class="eyebrow">Hồ sơ</span>
  <h1 style="font-size:1.9rem;">Hồ sơ thú cưng của bạn</h1>

  <p id="loginNotice" class="help-text">Vui lòng <a href="index.html#auth">đăng nhập</a> để xem hồ sơ thú cưng.</p>

  <div id="profileGate" class="hidden">
    <div class="card" id="petList"></div>

    <h2 style="margin-top:36px;">Thêm hồ sơ mới</h2>
    <div class="card">
      <form id="petForm">
        <div class="field-row">
          <div>
            <label for="petName">Tên thú cưng</label>
            <input id="petName" required />
          </div>
          <div>
            <label for="petSpecies">Loài</label>
            <select id="petSpecies">
              <option>Chó</option>
              <option>Mèo</option>
              <option>Khác</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label for="petBreed">Giống</label>
            <input id="petBreed" placeholder="Ví dụ: Poodle, Anh lông ngắn..." />
          </div>
          <div>
            <label for="petBirthYear">Năm sinh (ước tính)</label>
            <input id="petBirthYear" type="number" min="2000" max="2026" />
          </div>
        </div>
        <label for="petNotes">Ghi chú sức khoẻ</label>
        <textarea id="petNotes" placeholder="Dị ứng, bệnh nền, thói quen cần lưu ý..."></textarea>
        <button class="btn btn-primary" style="margin-top:16px;" type="submit">Lưu hồ sơ</button>
        <div id="petMsg" class="form-msg"></div>
      </form>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="assets/js/layout.js"></script>
<script type="module">
  import "./assets/js/auth.js";
  document.addEventListener("authready", (e) => {
    document.getElementById("loginNotice").classList.toggle("hidden", !!e.detail.user);
  });
</script>
<script type="module" src="assets/js/profile.js"></script>
</body>
</html>
