<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản trị — Sổ Tay Thú Cưng</title>
<meta name="theme-color" content="#2F4F41" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

<header id="site-header" class="site-header"></header>

<main class="wrap">
  <span class="eyebrow">Nội bộ</span>
  <div class="row-between">
    <h1 style="font-size:1.9rem;">Bảng lịch hẹn</h1>
    <span id="adminWhoami" class="help-text mono"></span>
  </div>

  <p id="deniedNotice" class="help-text">Trang này chỉ dành cho nhân viên / quản trị viên đã đăng nhập.</p>

  <div id="adminGate" class="hidden card">
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Ngày / Giờ</th>
            <th>Khách hàng</th>
            <th>Thú cưng</th>
            <th>Dịch vụ</th>
            <th>Ghi chú</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="apptTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="assets/js/layout.js"></script>
<script type="module">
  import "./assets/js/auth.js";
  document.addEventListener("authready", (e) => {
    const ok = e.detail.profile && ["staff", "admin"].includes(e.detail.profile.role);
    document.getElementById("deniedNotice").classList.toggle("hidden", !!ok);
  });
</script>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
